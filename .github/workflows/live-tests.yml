# Geplante Live-Tests gegen energiedashboard.admin.ch (DRIFT-005).
#
# Die Unit-Tests laufen gegen aufgezeichnete bzw. gemockte Antworten und
# koennen deshalb nicht bemerken, wenn die Quelle ihr Format aendert. Die
# `-m live`-Tests fragen sie wirklich ab; die CI der Pull Requests schliesst
# sie per `-m "not live"` aus, und das bleibt so.
#
# Zwei Ziele, weil es zwei Fragen sind:
#   main  Haelt der Quellcode auf `main` den Vertrag mit den Quellen?
#   pypi  Haelt das Paket, das Nutzer tatsaechlich installieren?
# Bis 2026-09-27 gab es nur die erste. 0.2.5 lieferte darum rund sieben Wochen
# lang fuer alle Tarif-Werkzeuge leere Antworten, waehrend dieser Lauf gruen
# war: `pip install -e` prueft `main`, und dort lag der Fix laengst. `main`
# gruen und `pypi` rot heisst: ein Release ist faellig.
#
# Achtung: `schedule` greift nur auf dem Default-Branch. Aenderungen an dieser
# Datei werden erst nach dem Merge wirksam. Vorher per `workflow_dispatch`
# von Hand ausloesen.

name: Live-Tests

on:
  schedule:
    # Woechentlich. Die ungerade Minute ist Absicht: Auf :00 legt GitHub die
    # Laeufe der halben Welt, und ein verzoegerter Cron faellt bei Last aus.
    # Gestaffelt gegen die uebrigen Server des Portfolios.
    - cron: "23 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: live-tests
  cancel-in-progress: false

jobs:
  live:
    name: Live-Suite (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Das eine Ziel darf das andere nicht abbrechen: gerade der Unterschied
      # zwischen beiden ist die Auskunft.
      fail-fast: false
      matrix:
        include:
          - target: main
            suite_dir: "."
            prefix: "Live-Tests gegen energiedashboard.admin.ch rot"
          - target: pypi
            suite_dir: released
            prefix: "Live-Tests gegen das veroeffentlichte Paket rot"

    steps:
      # Immer `main`: von hier kommen Einordnung und Issue-Logik.
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies (main, aus dem Quellcode)
        if: matrix.target == 'main'
        run: pip install -e ".[dev]"

      # Die neueste Version, die `pip` ohne Angabe waehlt — also das, was ein
      # Nutzer bekommt (keine Vorabversionen, nichts Zurueckgezogenes).
      - name: Veroeffentlichtes Paket installieren (pypi)
        if: matrix.target == 'pypi'
        id: pkg
        run: |
          pip install --no-cache-dir "swiss-electricity-mcp[dev]"
          V=$(python -c "import importlib.metadata as m; print(m.version('swiss-electricity-mcp'))")
          echo "version=${V:?Version nicht lesbar}" >> "$GITHUB_OUTPUT"

      # Die Suite des Release-Tags, nicht die von `main`: Tests und Paket aus
      # demselben Stand. Ein Test, den `main` seither dazugelernt hat, soll
      # nicht gegen ein Paket rot werden, das ihn nie kennen konnte.
      - name: Suite des Release-Tags holen (pypi)
        if: matrix.target == 'pypi'
        uses: actions/checkout@v7
        with:
          ref: v${{ steps.pkg.outputs.version }}
          path: released

      # Ohne `src/` kann nichts anderes importiert werden als das installierte
      # Paket. Die Zusicherung danach belegt es, statt es anzunehmen.
      - name: Quellcode entfernen, Import pruefen (pypi)
        if: matrix.target == 'pypi'
        working-directory: released
        env:
          PKG_VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          rm -rf src
          python - <<'EOF'
          import importlib.metadata as md, os
          import swiss_electricity_mcp as m
          assert "site-packages" in m.__file__, m.__file__
          assert md.version("swiss-electricity-mcp") == os.environ["PKG_VERSION"]
          print("geprueft wird", m.__file__, os.environ["PKG_VERSION"])
          EOF

      # `continue-on-error`, damit die Einordnung in jedem Fall laeuft. Rot
      # wird der Job weiter unten, aus dem eingeordneten Ergebnis.
      - name: Live-Suite
        id: suite
        continue-on-error: true
        working-directory: ${{ matrix.suite_dir }}
        env:
          OUT: ${{ github.workspace }}
        run: |
          set +e
          pytest -m live -v --junitxml="$OUT/live-report.xml" 2>&1 | tee "$OUT/live-output.txt"
          echo "pytest_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # `if: failure()` kennt rot und nicht rot. Ein Live-Lauf hat drei
      # Antworten, und die dritte zaehlt: Ein gescheitertes `pip install`, ein
      # Timeout oder eine umbenannte Marke sind NICHT dasselbe wie ein
      # gebrochener Vertrag mit der Quelle. Und ein Lauf, in dem jeder Test
      # uebersprungen wurde, sieht unter jedem Exit-Code-Check aus wie Erfolg.
      - name: Ergebnis einordnen
        id: verdict
        run: |
          python scripts/classify_live_run.py live-report.xml \
            --pytest-exit "${{ steps.suite.outputs.pytest_exit }}"
          {
            echo "tail<<PYTEST_TAIL"
            tail -n 40 live-output.txt || true
            echo "PYTEST_TAIL"
          } >> "$GITHUB_OUTPUT"

      - name: Issue oeffnen, aktualisieren oder schliessen
        uses: actions/github-script@v9
        # Ueber `env`, nicht ueber `${{ }}` im Skript: Die pytest-Ausgabe ist
        # fremder Text, der sonst in einem JavaScript-Template-Literal landet.
        # Ein Backtick oder ein `${` darin bricht das Skript oder fuehrt aus,
        # was in einer Assertion-Meldung stand.
        env:
          LIVE_STATE: ${{ steps.verdict.outputs.state }}
          LIVE_REASON: ${{ steps.verdict.outputs.reason }}
          LIVE_TAIL: ${{ steps.verdict.outputs.tail }}
          LIVE_TARGET: ${{ matrix.target }}
          LIVE_PREFIX: ${{ matrix.prefix }}
          PKG_VERSION: ${{ steps.pkg.outputs.version }}
        with:
          script: |
            const state = process.env.LIVE_STATE;
            const reason = process.env.LIVE_REASON || '';
            const tail = process.env.LIVE_TAIL || '(keine Ausgabe)';
            // Stabiles Praefix: Damit ein zweiter roter Lauf den bestehenden
            // Thread verlaengert statt einen zweiten aufzumachen. Zehn Issues
            // zur selben Sache liest niemand.
            // Je Ziel ein eigenes Praefix: Ein gruener `main`-Lauf darf das
            // Issue zum veroeffentlichten Paket nicht schliessen.
            const PREFIX = process.env.LIVE_PREFIX;
            const target = process.env.LIVE_TARGET;
            const version = process.env.PKG_VERSION || '';
            const LABEL = 'upstream';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                        `/actions/runs/${context.runId}`;
            const heute = new Date().toISOString().slice(0, 10);

            // `issues.listForRepo` statt der Such-API: Die Suche hat ein
            // eigenes, knappes Rate-Limit und indexiert verzoegert — ein frisch
            // geoeffnetes Issue findet sie unter Umstaenden nicht, und dann
            // legt der naechste rote Lauf ein zweites an.
            const issues = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: LABEL, per_page: 100,
            });
            const open = issues.data.find(
              (i) => !i.pull_request && i.title.startsWith(PREFIX)
            );

            if (state === 'unknown') {
              // Weder oeffnen noch schliessen. Der Lauf hat nichts ueber den
              // Vertrag mit energiedashboard.admin.ch festgestellt, und ein Issue, das auf so
              // einen Lauf hin zugeht, behauptet einen Vergleich, den es nicht
              // gab. Sichtbar wird es ueber den roten Job.
              core.warning(`Live-Suite nicht ausgewertet: ${reason}. Am Issue wurde nichts geaendert.`);
              return;
            }

            if (state === 'finding') {
              const kopf = target === 'pypi'
                ? [
                    `Die Live-Suite gegen das **veroeffentlichte Paket** ` +
                      `(\`swiss-electricity-mcp ${version}\` von PyPI, Suite des Tags \`v${version}\`) ist rot.`,
                    '',
                    'Ist der Lauf gegen `main` gleichzeitig gruen, liegt der Fix im Quellcode',
                    'und nicht im Paket: **ein Release ist faellig.** Genau so lag 0.2.5 im',
                    'Sommer 2026 sieben Wochen kaputt auf PyPI.',
                  ]
                : ['Die geplante Live-Suite gegen `energiedashboard.admin.ch` ist rot.'];
              const body = [
                ...kopf,
                '',
                `Lauf: ${run}`,
                `Einordnung: ${reason}`,
                '',
                '**Rot heisst hier nicht zwingend «unser Fehler».** Es heisst: Der Vertrag',
                'mit der Quelle hat sich geaendert, oder die Quelle ist gerade aus. Beides',
                'gehoert gesehen, nur das Erste gehoert gefixt — und genau das Erste sehen',
                'die Unit-Tests nicht, weil ihre Fixtures aus derselben Annahme geschrieben',
                'sind wie der Code.',
                '',
                'Erst die Quelle abfragen, dann einordnen — nicht aus der Fehlermeldung',
                'schliessen.',
                '',
                '<details><summary>Letzte Zeilen der pytest-Ausgabe</summary>',
                '',
                '```',
                tail,
                '```',
                '',
                '</details>',
              ].join('\n');

              if (open) {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: open.number,
                  body: `Wieder rot am ${heute}.\n\n${body}`,
                });
              } else {
                // Das Label anlegen, falls das Repo es noch nicht kennt: Sonst
                // scheitert `issues.create` beim allerersten roten Lauf — genau
                // dann, wenn das Issue gebraucht wird.
                try {
                  await github.rest.issues.createLabel({
                    ...context.repo, name: LABEL, color: 'd93f0b',
                    description: 'Vertrag mit einer externen Quelle betroffen',
                  });
                } catch (e) {
                  if (e.status !== 422) throw e;  // 422 = existiert bereits
                }
                await github.rest.issues.create({
                  ...context.repo, title: `${PREFIX} (${heute})`, body, labels: [LABEL],
                });
              }
              return;
            }

            // clear — und nur hier wird zugemacht, weil nur hier wirklich
            // verglichen und nichts gefunden wurde.
            if (open) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: open.number,
                body: `Die Live-Suite ist wieder gruen (${reason}). Lauf: ${run}`,
              });
              await github.rest.issues.update({
                ...context.repo, issue_number: open.number,
                state: 'closed', state_reason: 'completed',
              });
            }

      # Erst hier wird der Job rot. `clear` ist gruen; `finding` und `unknown`
      # sind beide rot, aber nur `finding` hat oben ein Issue erzeugt — der
      # Unterschied steht im Log, nicht im Exit-Code.
      - name: Ergebnis durchreichen
        if: steps.verdict.outputs.state != 'clear'
        # Ueber `env`, nicht ueber `${{ }}`: Der Grund kann eine Parser-Meldung
        # ueber eine fremde Datei enthalten, und `${{ }}` setzt ihn vor dem Start
        # woertlich in die Shell ein — ein `$(...)` oder ein Anfuehrungszeichen
        # darin liefe mit. Der github-script-Schritt macht es aus demselben Grund
        # schon so.
        env:
          LIVE_STATE: ${{ steps.verdict.outputs.state }}
          LIVE_REASON: ${{ steps.verdict.outputs.reason }}
        run: |
          echo "Live-Suite: $LIVE_STATE"
          echo "$LIVE_REASON"
          exit 1
