# Der Pin hier und der Pin in .github/workflows/test.yml («Install pinned
# ruff») muessen dieselbe Version nennen: v0.16.1 == ruff==0.16.1.
#
# Weichen sie ab, meldet lokal und in der CI je eine andere ruff-Version
# Abweichungen, die niemand verursacht hat — und der Diff, in dem das
# auffaellt, hat damit nichts zu tun. Wer eine der beiden Stellen hochzieht,
# zieht die andere im selben Commit mit.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      # `files` spiegelt `ruff check src/ tests/ scripts/` aus der CI. Ohne
      # die Einschraenkung pruefte pre-commit auch Python ausserhalb dieser
      # drei Baeume und wuerde an Dateien rot, an denen die CI nie rot wird.
      - id: ruff-check
        files: ^(src|tests|scripts)/
      - id: ruff-format
        files: ^(src|tests|scripts)/
